<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StriveHigh LMS{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <span class="brand-icon">🧠</span>
                StriveHigh
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <span id="nav-auth">
                    <a href="/login" class="nav-link">Login</a>
                    <a href="/register" class="btn btn-primary">Get Started</a>
                </span>
            </div>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
        </div>
    </nav>
    <main class="main-content">{% block content %}{% endblock %}</main>
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 StriveHigh. Supporting mental health education with secure content delivery.</p>
        </div>
    </footer>
    <div id="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = getCurrentUser();
        const nav = document.getElementById('nav-auth');
        if (user) {
            nav.innerHTML = `
                <a href="/dashboard" class="nav-link">Dashboard</a>
                ${user.role === 'admin' || user.role === 'instructor' ? '<a href="/admin" class="nav-link">Admin</a>' : ''}
                <div class="nav-user">
                    <span>${user.name}</span>
                    <button onclick="logout()" class="btn btn-sm btn-outline">Logout</button>
                </div>
            `;
        }
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
