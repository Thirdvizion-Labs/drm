{% extends "base.html" %}
{% block title %}Lesson - StriveHigh{% endblock %}
{% block content %}
<div class="lesson-container">
    <div id="lesson-detail"><div class="loading">Loading lesson...</div></div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="/static/js/video-player.js"></script>
<script>
const lessonId = {{ lesson_id }};
let drmPlayer = null;

async function loadLesson() {
    const container = document.getElementById('lesson-detail');
    const token = localStorage.getItem('access_token');
    if (!token) { window.location.href = '/login'; return; }

    try {
        const playRes = await apiRequest(`/api/video/${lessonId}/play`);
        if (!playRes.ok) {
            const lessonRes = await apiRequest(`/api/lessons/${lessonId}`);
            if (!lessonRes.ok) { container.innerHTML = '<p class="error">Lesson not found</p>'; return; }
            const lesson = await lessonRes.json();
            renderTextLesson(container, lesson);
            return;
        }
        const playData = await playRes.json();
        renderVideoLesson(container, playData, token);
    } catch (e) {
        container.innerHTML = '<p class="error">Failed to load lesson</p>';
    }
}

function renderTextLesson(container, lesson) {
    container.innerHTML = `
        <div class="lesson-header">
            <a href="/dashboard" class="back-link">← Back to Dashboard</a>
            <h1>${lesson.title}</h1>
        </div>
        <div class="lesson-content-grid">
            <div class="lesson-main">
                <div class="video-wrapper">
                    <div class="video-placeholder">
                        <p>📝 Text-Based Lesson</p>
                        <p class="video-info">No video content for this lesson. Read the content below.</p>
                    </div>
                </div>
                <div class="lesson-text">
                    <h2>Lesson Content</h2>
                    <div class="content-text">${lesson.content_text || '<p>No content available.</p>'}</div>
                </div>
            </div>
            <div class="lesson-sidebar">
                <div class="lesson-progress-card">
                    <h3>Progress</h3>
                    <button class="btn btn-sm btn-outline btn-block" onclick="markComplete()">Mark as Complete</button>
                </div>
            </div>
        </div>
    `;
}

function renderVideoLesson(container, data, token) {
    container.innerHTML = `
        <div class="lesson-header">
            <a href="/dashboard" class="back-link">← Back to Dashboard</a>
            <h1>${data.title}</h1>
        </div>
        <div class="lesson-content-grid">
            <div class="lesson-main">
                <div class="video-wrapper">
                    <video id="protected-video" controls style="width:100%;height:auto;max-height:500px;"></video>
                </div>
                <div class="lesson-text">
                    <h2>About This Lesson</h2>
                    <div class="content-text">
                        <p>Duration: ${data.duration_minutes} minutes</p>
                        <p>🔒 This content is DRM protected with AES-128 encryption.</p>
                    </div>
                </div>
            </div>
            <div class="lesson-sidebar">
                <div class="lesson-progress-card">
                    <h3>Progress</h3>
                    <div id="lesson-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 0%"></div>
                        </div>
                        <span id="progress-text">0%</span>
                    </div>
                    <button class="btn btn-sm btn-outline btn-block" onclick="markComplete()">Mark as Complete</button>
                </div>
                <div class="lesson-nav">
                    <h3>Actions</h3>
                    <button class="btn btn-primary btn-block" onclick="window.location.href='/dashboard'">
                        Back to Dashboard →
                    </button>
                </div>
            </div>
        </div>
    `;

    const video = document.getElementById('protected-video');
    const manifestUrl = data.manifest_url;

    if (Hls.isSupported()) {
        const hls = new Hls({
            xhrSetup: (xhr) => {
                xhr.setRequestHeader('Authorization', `Bearer ${token}`);
            }
        });
        hls.loadSource(manifestUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = manifestUrl;
    }

    video.addEventListener('timeupdate', () => {
        const pct = Math.floor((video.currentTime / video.duration) * 100);
        const fill = document.querySelector('#lesson-progress .progress-fill');
        const text = document.getElementById('progress-text');
        if (fill && !isNaN(pct)) fill.style.width = pct + '%';
        if (text) text.textContent = pct + '%';
    });

    video.addEventListener('ended', () => markComplete());
    loadProgress();
}

async function loadProgress() {
    try {
        const res = await apiRequest(`/api/progress/${lessonId}`);
        if (res.ok) {
            const p = await res.json();
            if (p.is_completed) {
                const fill = document.querySelector('#lesson-progress .progress-fill');
                const text = document.getElementById('progress-text');
                if (fill) fill.style.width = '100%';
                if (text) text.textContent = 'Completed!';
            }
        }
    } catch (e) {}
}

async function markComplete() {
    const token = localStorage.getItem('access_token');
    try {
        const res = await fetch(`/api/progress/${lessonId}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_completed: true })
        });
        if (res.ok) {
            showToast('Lesson completed!', 'success');
            loadProgress();
        }
    } catch (e) {
        showToast('Failed to save', 'error');
    }
}

document.addEventListener('DOMContentLoaded', loadLesson);
</script>
{% endblock %}
