{% extends "base.html" %}
{% block title %}Course - MindWell{% endblock %}
{% block content %}
<div class="container">
    <div id="course-detail"><div class="loading">Loading course...</div></div>
</div>
{% endblock %}
{% block scripts %}
<script>
const courseId = {{ course_id }};

async function loadCourse() {
    const container = document.getElementById('course-detail');
    const token = localStorage.getItem('access_token');
    if (!token) { window.location.href = '/login'; return; }

    try {
        const res = await fetch(`/api/courses/${courseId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) { container.innerHTML = '<p class="error">Course not found</p>'; return; }
        const c = await res.json();

        container.innerHTML = `
            <div class="course-header">
                <div class="course-thumbnail-large">
                    <img src="${c.thumbnail_url || 'https://picsum.photos/400/225'}" alt="${c.title}">
                </div>
                <div class="course-header-info">
                    <h1>${c.title}</h1>
                    <p class="course-instructor">by ${c.instructor || 'Instructor'}</p>
                    <p class="course-description">${c.description || ''}</p>
                    ${c.is_enrolled ? `
                        <div class="course-progress-info">
                            <button class="btn btn-primary" onclick="window.location.href='/lesson/${(c.modules||[])[0]?.lessons?.[0]?.id || ''}'">
                                Continue Learning
                            </button>
                        </div>
                    ` : `
                        <button class="btn btn-primary btn-lg" onclick="enrollCourse()">Enroll Now</button>
                    `}
                </div>
            </div>
            <div class="course-curriculum">
                <h2>Course Content</h2>
                <p class="curriculum-meta">${(c.modules||[]).length} modules • ${countLessons(c.modules)} lessons</p>
                <div class="modules-list">
                    ${(c.modules||[]).map((m, mi) => `
                        <div class="module-card">
                            <div class="module-header" onclick="toggleModule(${mi})">
                                <h3>${m.title}</h3>
                                <span class="toggle-icon">▼</span>
                            </div>
                            <div class="module-content" id="module-${mi}">
                                <p class="module-description">${m.description || ''}</p>
                                <div class="lessons-list">
                                    ${(m.lessons||[]).map((l, li) => `
                                        <div class="lesson-item ${!c.is_enrolled ? 'lesson-locked' : ''}"
                                             ${c.is_enrolled ? `onclick="window.location.href='/lesson/${l.id}'"` : ''}>
                                            <div class="lesson-info">
                                                <span class="lesson-number">${li+1}</span>
                                                <div>
                                                    <h4>${l.title}</h4>
                                                    <span class="lesson-duration">⏱️ ${l.duration_minutes} min</span>
                                                </div>
                                            </div>
                                            ${!c.is_enrolled ? '<span class="lock-icon">🔒</span>' : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        for (let i = 1; i < (c.modules||[]).length; i++) {
            const el = document.getElementById(`module-${i}`);
            if (el) el.style.display = 'none';
        }
    } catch (e) {
        container.innerHTML = '<p class="error">Failed to load course</p>';
    }
}

function countLessons(modules) {
    if (!modules) return 0;
    return modules.reduce((s, m) => s + (m.lessons||[]).length, 0);
}

function toggleModule(idx) {
    const el = document.getElementById(`module-${idx}`);
    if (!el) return;
    const icon = el.previousElementSibling?.querySelector('.toggle-icon');
    if (el.style.display === 'none') {
        el.style.display = 'block';
        if (icon) icon.textContent = '▼';
    } else {
        el.style.display = 'none';
        if (icon) icon.textContent = '▶';
    }
}

async function enrollCourse() {
    const token = localStorage.getItem('access_token');
    try {
        const res = await fetch(`/api/courses/${courseId}/enroll`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            showToast('Enrolled!', 'success');
            loadCourse();
        } else {
            const d = await res.json();
            showToast(d.error || 'Failed', 'error');
        }
    } catch (e) {
        showToast('Error', 'error');
    }
}

document.addEventListener('DOMContentLoaded', loadCourse);
</script>
{% endblock %}
