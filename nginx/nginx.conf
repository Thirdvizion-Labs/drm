upstream flask_app {
    server app:5000;
}

server {
    listen 80;
    server_name drm.thirdvizion.com;

    client_max_body_size 500M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name drm.thirdvizion.com;

    client_max_body_size 500M;

    ssl_certificate /etc/letsencrypt/live/drm.thirdvizion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drm.thirdvizion.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve static files directly (CSS, JS)
    location /static/css/ {
        alias /var/www/hls/../css/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/js/ {
        alias /var/www/hls/../js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve HLS segments directly via Nginx (fast)
    location /api/video/ {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't cache video content
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Serve HLS segments via Nginx directly (static files)
    location /hls/ {
        alias /var/www/hls/;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";

        # Deny direct access to key files (only serve through API)
        location ~ /hls/(.*)/video\.key$ {
            deny all;
            return 403;
        }
    }

    # API proxy
    location /api/ {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin interface
    location /admin {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback to Flask for everything else
    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/mindwell-access.log;
    error_log /var/log/nginx/mindwell-error.log;
}
