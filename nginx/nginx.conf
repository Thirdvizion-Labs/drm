upstream flask_app {
    server 127.0.0.1:7200;
}

upstream frontend {
    server 127.0.0.1:7201;
}

server {
    listen 80;
    server_name drm.thirdvizion.com;

    client_max_body_size 500M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name drm.thirdvizion.com;

    client_max_body_size 500M;

    ssl_certificate /etc/letsencrypt/live/drm.thirdvizion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drm.thirdvizion.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # React SPA (frontend container)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → Flask backend
    location /api/ {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files → Flask (for admin uploads etc.)
    location /static/ {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
    }

    # HLS video segments → Flask (which serves from bind-mounted /static/hls)
    location /hls/ {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;

        location ~ /hls/(.*)/video\.key$ {
            deny all;
            return 403;
        }
    }

    access_log /var/log/nginx/mindwell-access.log;
    error_log /var/log/nginx/mindwell-error.log;
}
