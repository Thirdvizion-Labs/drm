services:
  app:
    build: .
    container_name: strivehigh-app
    restart: unless-stopped
    ports:
      - "7200:7200"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-jwt-in-production}
      - DOMAIN_URL=https://drm.thirdvizion.com
      - FLASK_ENV=production
    volumes:
      - ./instance:/app/instance
      - ./videos:/app/videos
      - ./static/hls:/app/static/hls
    networks:
      - strivehigh

  frontend:
    build: ./frontend
    container_name: strivehigh-frontend
    restart: unless-stopped
    ports:
      - "7201:80"
    depends_on:
      - app
    networks:
      - strivehigh

networks:
  strivehigh:
