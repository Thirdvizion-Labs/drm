services:
  app:
    build: .
    container_name: mindwell-app
    restart: unless-stopped
    ports:
      - "7200:7200"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-jwt-in-production}
      - DOMAIN_URL=https://drm.thirdvizion.com
      - FLASK_ENV=production
    volumes:
      - mindwell_instance:/app/instance
      - mindwell_videos:/app/videos
      - mindwell_hls:/app/static/hls

volumes:
  mindwell_instance:
  mindwell_videos:
  mindwell_hls:
