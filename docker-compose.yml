services:
  app:
    build: .
    container_name: mindwell-app
    restart: unless-stopped
    ports:
      - "7200:7200"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-jwt-in-production}
      - DOMAIN_URL=https://drm.thirdvizion.com
      - FLASK_ENV=production
    volumes:
      - mindwell_instance:/app/instance
      - mindwell_videos:/app/videos
      - mindwell_hls:/app/static/hls
    networks:
      - mindwell-network

  nginx:
    image: nginx:1.25-alpine
    container_name: mindwell-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - mindwell_hls:/var/www/hls:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - mindwell-network

  certbot:
    image: certbot/certbot
    container_name: mindwell-certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mindwell_instance:
  mindwell_videos:
  mindwell_hls:

networks:
  mindwell-network:
